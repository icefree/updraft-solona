[workspace]
members = [
    "programs/*"
, "tests"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Override constant_time_eq to a local copy built with edition 2021 to avoid the
# unstable edition2024 requirement in upstream 0.4.x.
constant_time_eq = { path = "vendor/constant_time_eq" }
blake3 = { path = "vendor/blake3" }
